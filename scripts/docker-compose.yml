version: "3.8"
name: datahub

networks:
  datahub_network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: datahub-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_ROOT_PASSWORD: datahub
      MYSQL_DATABASE: datahub
      MYSQL_USER: datahub
      MYSQL_PASSWORD: datahub
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "datahub", "-pdatahub"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - datahub_network

  elasticsearch:
    image: elasticsearch:7.16.3
    container_name: datahub-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - datahub_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.2
    container_name: datahub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - datahub_network

  broker:
    image: confluentinc/cp-kafka:7.9.2
    container_name: datahub-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://broker:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - datahub_network

  datahub-gms:
    image: acryldata/datahub-gms:latest
    container_name: datahub-gms
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATAHUB_SERVER_TYPE: "quickstart"
      KAFKA_BOOTSTRAP_SERVER: "broker:29092"
      KAFKA_SCHEMAREGISTRY_URL: "http://schema-registry:8081"
      ELASTICSEARCH_HOST: "elasticsearch"
      ELASTICSEARCH_PORT: 9200
      EBEAN_DATASOURCE_HOST: "mysql"
      EBEAN_DATASOURCE_PORT: 3306
      EBEAN_DATASOURCE_USERNAME: "datahub"
      EBEAN_DATASOURCE_PASSWORD: "datahub"
      EBEAN_DATASOURCE_DRIVER: "com.mysql.cj.jdbc.Driver"
      EBEAN_DATASOURCE_URL: "jdbc:mysql://mysql:3306/datahub?verifyServerCertificate=false&useSSL=false"
      ELASTICSEARCH_USERNAME: ""
      ELASTICSEARCH_PASSWORD: ""
      MAE_CONSUMER_ENABLED: "true"
      MCE_CONSUMER_ENABLED: "true"
      JAVA_OPTS: "-Xms1g -Xmx1g"
    networks:
      - datahub_network

  datahub-frontend-react:
    image: acryldata/datahub-frontend-react:latest
    container_name: datahub-frontend
    depends_on:
      datahub-gms:
        condition: service_started
    ports:
      - "9002:9002"
    environment:
      DATAHUB_GMS_HOST: "datahub-gms"
      DATAHUB_GMS_PORT: 8080
      DATAHUB_WEB_HOST: "0.0.0.0"
      DATAHUB_SECRET: "YouKnowNothing"
    networks:
      - datahub_network

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.2
    container_name: datahub-schema-registry
    depends_on:
      broker:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - datahub_network